apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: asr-peft-mlflow-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: asr-peft-mlflow
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: asr-peft-mlflow
  template:
    metadata:
      labels:
        app: asr-peft-mlflow
    spec:
      imagePullSecrets:
      - name: asr-peft-pull-secret
      containers:
      - name: mlflow
        image: intmidlaiercscr71ee46dc.azurecr.io/mlflow:latest
        ports:
        - containerPort: 5000
          name: http
        volumeMounts:
        - name: mlflow-data
          mountPath: /mlflow
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
      volumes:
      - name: mlflow-data
        persistentVolumeClaim:
          claimName: asr-peft-mlflow-data
---
apiVersion: v1
kind: Service
metadata:
  name: asr-peft-mlflow
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: asr-peft-mlflow
  ports:
  - port: 5000
    targetPort: 5000
    protocol: TCP
    name: http

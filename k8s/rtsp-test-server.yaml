# RTSP test server for ASR pipeline testing.
#
# Two containers in one pod:
#   mediamtx  — lightweight RTSP server (bluenviron/mediamtx)
#   publisher — ffmpeg generating an alternating tone/silence stream
#               (4s of 440Hz tone, 4s silence, repeating)
#               This exercises the VAD: speech windows trigger transcription,
#               silence windows are skipped.
#
# In-cluster RTSP URL:  rtsp://rtsp-test-server:8554/stream
# External RTSP URL:    rtsp://<node-ip>:30854/stream
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtsp-test-server
  namespace: default
  labels:
    app: rtsp-test-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rtsp-test-server
  template:
    metadata:
      labels:
        app: rtsp-test-server
    spec:
      containers:
      - name: mediamtx
        image: bluenviron/mediamtx:latest
        ports:
        - containerPort: 8554
          name: rtsp
        env:
        - name: MTX_LOGLEVEL
          value: "warn"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

      - name: publisher
        image: alpine:3.19
        command: ["/bin/sh", "-c"]
        args:
          - |
            apk add --no-cache ffmpeg
            echo "Waiting for mediamtx to start..."
            sleep 4
            echo "Starting RTSP publisher..."
            while true; do
              ffmpeg -hide_banner -loglevel warning \
                -re \
                -f lavfi \
                -i "aevalsrc=if(mod(floor(t/4)\,2)\,sin(2*PI*440*t)*0.3+sin(2*PI*880*t)*0.15\,0):s=16000:c=mono" \
                -c:a aac -b:a 64k -ar 16000 -ac 1 \
                -f rtsp \
                rtsp://localhost:8554/stream
              echo "Publisher exited, restarting in 2s..."
              sleep 2
            done
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: rtsp-test-server
  namespace: default
spec:
  type: NodePort
  selector:
    app: rtsp-test-server
  ports:
  - name: rtsp
    port: 8554
    targetPort: 8554
    nodePort: 30854
    protocol: TCP

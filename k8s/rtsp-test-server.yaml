apiVersion: v1
kind: ConfigMap
metadata:
  name: rtsp-test-audio
  namespace: default
data:
  # Simple script to generate a test audio stream
  stream.sh: |
    #!/bin/sh
    echo "Generating test audio stream..."
    # Generate a simple sine wave audio (beep pattern) as test content
    ffmpeg -re -f lavfi -i "sine=frequency=440:duration=10" \
      -stream_loop -1 \
      -c:a aac -b:a 128k -ar 44100 -ac 2 \
      -f rtsp -rtsp_transport tcp \
      rtsp://localhost:8554/test-stream
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtsp-test-server
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rtsp-test-server
  template:
    metadata:
      labels:
        app: rtsp-test-server
    spec:
      containers:
      # RTSP Server
      - name: rtsp-server
        image: bluenviron/mediamtx:latest
        ports:
        - containerPort: 8554
          name: rtsp
        - containerPort: 8888
          name: webrtc
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
      # FFmpeg publisher (publishes test audio to the RTSP server)
      - name: ffmpeg-publisher
        image: linuxserver/ffmpeg:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for RTSP server to be ready..."
            sleep 5
            echo "Starting test audio stream..."
            # Generate a continuous sine wave (beep) audio stream
            while true; do
              ffmpeg -re -f lavfi -i "sine=frequency=440:duration=30" \
                -c:a aac -b:a 128k -ar 44100 -ac 2 \
                -f rtsp -rtsp_transport tcp \
                rtsp://localhost:8554/test-stream || sleep 2
            done
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: rtsp-test-server
  namespace: default
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.3.155
  selector:
    app: rtsp-test-server
  ports:
  - port: 8554
    targetPort: 8554
    protocol: TCP
    name: rtsp
  - port: 8888
    targetPort: 8888
    protocol: TCP
    name: webrtc

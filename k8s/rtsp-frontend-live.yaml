apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtsp-frontend-live
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rtsp-frontend-live
  template:
    metadata:
      labels:
        app: rtsp-frontend-live
    spec:
      imagePullSecrets:
      - name: asr-peft-pull-secret
      containers:
      - name: frontend
        image: intmidlaiercscr71ee46dc.azurecr.io/rtsp-frontend-live:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: VITE_RTSP_BACKEND_URL
          value: "http://192.168.4.11:30002"
        resources:
          limits:
            memory: "256Mi"
            cpu: "200m"
          requests:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: rtsp-frontend-live
  namespace: default
spec:
  selector:
    app: rtsp-frontend-live
  ports:
  - port: 3000
    targetPort: 3000
    name: http
    nodePort: 30003
  type: NodePort

version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/workspace/data
      - huggingface-cache:/workspace/.cache/huggingface  # Cache models across rebuilds
      - mlflow-data:/mlflow  # Share MLflow artifacts with mlflow service
    environment:
      - PYTHONUNBUFFERED=1
      - ENABLE_DIFFERENTIAL_PRIVACY=false  # Set to 'true' to enable DP for training
      - MLFLOW_TRACKING_URI=http://asr-peft-mlflow:5000  # Point to MLflow tracking server
  
  asr-peft-mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow  # Persistent storage for experiments and artifacts
    environment:
      - PYTHONUNBUFFERED=1
  
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - VITE_BACKEND_URL=http://localhost:8000

volumes:
  huggingface-cache:  # Named volume for model cache persistence
  mlflow-data:  # Named volume for MLflow tracking data